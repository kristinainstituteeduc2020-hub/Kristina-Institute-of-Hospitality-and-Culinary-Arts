<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kristina Institute — TESDA Programs</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="tesda-modal.css" />
  <style>

    .page{padding:26px 0 40px;}
    .section-head{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:14px;}

    .grid-tesda{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:14px;
      align-items:stretch;
    }

    @media(max-width:980px){.grid-tesda{grid-template-columns:repeat(2, 1fr);}}
    @media(max-width:680px){.grid-tesda{grid-template-columns:1fr;}}

    .tesda-card{
      background:rgba(255,255,255,.05);
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:260px;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      box-shadow: 0 0 0 rgba(0,0,0,0);
    }
    .tesda-card:hover{
      transform: translateY(-3px);
      border-color: rgba(79,140,255,.45);
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    .tesda-card-media{
      height:150px;
      background:#0d1528;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .tesda-card-media img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .tesda-card-media .media-placeholder{
      padding:14px;
      color:rgba(255,255,255,.8);
      font-weight:800;
      text-align:center;
      line-height:1.3;
    }

    .tesda-card-body{padding:14px 14px 16px; display:flex; flex-direction:column; flex:1;}

    .badges{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

    .tesda-title{font-size:16px; margin:10px 0 0;}

    .tesda-card-content{
      margin-top:10px;
      color:var(--text);
      line-height:1.55;
      display:-webkit-box;
      -webkit-box-orient:vertical;
      overflow:hidden;
      -webkit-line-clamp:4;
    }

    .media-tags{
      margin-top:12px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .tag{
      font-size:12.5px;
      color:var(--muted);
      border:1px solid var(--border);
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.02);
      font-weight:800;
    }

    .tesda-card-actions{
      padding:12px 0 0;
      margin-top:auto;
      border-top:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .tesda-viewbtn{display:inline-flex; align-items:center; justify-content:center;}

    .back-link{color:var(--muted); text-decoration:none; font-weight:800; border:1px solid var(--border); padding:7px 10px; border-radius:12px;}
    .back-link:hover{color:var(--text)}
  </style>
</head>
<body class="has-bg-image">
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <img class="brand-logo" src="assets/KIHCA LOGO MALIWANAG.png" alt="" />
        </div>
        <div>
          <div class="brand-title">Kristina Institute</div>
          <div class="brand-subtitle">Hospitality &amp; Culinary Arts</div>
        </div>
      </div>
      <nav class="nav">
        <a href="index.html" class="nav-link">Home</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div class="section-head">
        <div>
          <h1 style="margin:0; font-size:22px;">TESDA Programs</h1>
<div class="muted" style="margin-top:6px;">Select a posted program to view details.</div>
        </div>
        <div>
          <a class="back-link" href="index.html#tesda">Back</a>
        </div>
      </div>

      <div style="margin-top:10px;">
        <div class="grid-tesda" id="tesdaCards"></div>
      </div>

    </div>
  </main>

  <div id="tesdaModalOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:9999; padding:18px;">
    <div id="tesdaModal" style="max-width:980px; margin:0 auto; background:rgba(15,23,42,.98); border:1px solid var(--border); border-radius:18px; overflow:hidden; box-shadow:var(--shadow);">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border);">
        <div>
          <div style="font-weight:900; font-size:16px;">TESDA Programs</div>
          <div id="tesdaModalSub" style="color:var(--muted); font-size:12.5px; margin-top:4px;">—</div>
        </div>
        <button type="button" id="tesdaModalCloseBtn" class="btn-secondary" style="padding:9px 12px;">Close</button>
      </div>
      <div style="padding:14px 16px;">
      <div id="tesdaModalBody" style="min-height:90px;">Loading…</div>

      </div>
    </div>
  </div>

  <script>
    const qs = new URLSearchParams(location.search);
    const initialCategory = qs.get('cat') || '';


    const TESDA_CATEGORIES = [
      {
        key: 'UTPRAS',
        cardTitle: 'UTPRAS',
        short: 'Programs related to UTPRAS and assessment preparation.'
      },
      {
        key: 'Assessment Certification & Accreditation',
        cardTitle: 'Assessment Certification & Accreditation',
        short: 'Admin-posted assessment and certification programs.'
      },
      {
        key: 'Community-Based Training Qualifications',
        cardTitle: 'Community-Based Training Qualifications',
        short: 'Community training programs posted by the admin.'
      }
    ];


    function escapeHtml(s){
      return (s ?? '').toString()
        .replaceAll('&','&amp;')
        .replaceAll('<','<')
        .replaceAll('>','>')
        .replaceAll('"','"')
        .replaceAll("'",'&#039;');
    }

    async function fetchJSON(url){
      const res = await fetch(url);
      if(!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function escapeAttr(s){
      return (s ?? '').toString().replaceAll('"','"');
    }

    function fmtDate(d){
      if(!d) return '';
      try{
        return new Date(d).toLocaleDateString();
      }catch(e){
        return '';
      }
    }

    function openModalForCategory(catKey){
      const overlay = document.getElementById('tesdaModalOverlay');
      const body = document.getElementById('tesdaModalBody');
      const sub = document.getElementById('tesdaModalSub');

      const cat = TESDA_CATEGORIES.find(c => c.key === catKey);

      sub.textContent = cat ? cat.cardTitle : catKey;

      overlay.style.display = 'block';
      body.innerHTML = 'Loading programs…';

      fetchJSON(`api/tesda_list_by_category.php?category=${encodeURIComponent(catKey)}&limit=50`)
        .then(data => {
          const items = (data.items || []);
          if(!items.length){
            body.innerHTML = '<div class="muted">No programs posted yet for this category.</div>';
            return;
          }

          body.innerHTML = `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
              ${items.map(it => {
                const title = escapeHtml(it.title);
                const desc = (it.content || '').trim();
                const preview = escapeHtml(desc.length > 140 ? desc.slice(0,140) + '…' : desc);
                const img = it.image_path ? it.image_path : '';
                const date = fmtDate(it.created_at);
                const hasMediaTag = [it.video_path ? 'Video' : '', it.attachment_path ? 'Files' : ''].filter(Boolean);
                const tags = hasMediaTag.map(t => `<span class="tag" style="font-size:12px;">${t}</span>`).join('');

                // Optional: keep existing details pages for now
                const detailsUrl =
                  (it.type === 'tesda_assessment') ? `view_assessment.php?id=${encodeURIComponent(it.id)}` :
                  (it.type === 'tesda_training') ? `view_community_training.php?id=${encodeURIComponent(it.id)}` :
                  `view_utpras.php?id=${encodeURIComponent(it.id)}`;

                return `
                  <div style="background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:16px; overflow:hidden;">
                    <div style="height:130px; background:#0d1528; display:flex; align-items:center; justify-content:center; overflow:hidden;">
                      ${img ? `<img src="${escapeAttr(img)}" alt="${title}" style="width:100%; height:100%; object-fit:cover;" loading="lazy"/>` : `<div style="padding:12px; color:rgba(255,255,255,.8); font-weight:900; text-align:center;">No banner</div>`}
                    </div>
                    <div style="padding:12px 12px 14px;">
                      <div style="color:var(--muted); font-size:12.5px; display:flex; gap:10px; flex-wrap:wrap;">
                        ${date ? `<span>${escapeHtml(date)}</span>` : ''}
                      </div>
                      <div style="font-weight:950; margin-top:8px; line-height:1.25;">${title}</div>
                      <div style="color:var(--text); margin-top:8px; line-height:1.6; font-size:14px; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;">${preview || '—'}</div>
                      <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">${tags}</div>
                      <div style="margin-top:12px; display:flex; justify-content:flex-end;">
                        <a class="small-link" href="${detailsUrl}" style="text-decoration:none;">Learn More</a>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        })
        .catch(err => {
          console.error(err);
          body.innerHTML = '<div class="muted" style="color:var(--danger);">Failed to load programs.</div>';
        });
    }

    window.__openTesdaModal = (catKey) => openModalForCategory(catKey);

    (function bindModal(){
      const overlay = document.getElementById('tesdaModalOverlay');
      const closeBtn = document.getElementById('tesdaModalCloseBtn');

      if(!overlay || !closeBtn) return;

      closeBtn.addEventListener('click', () => { overlay.style.display = 'none'; });
      overlay.addEventListener('click', (e) => {
        if(e.target === overlay) overlay.style.display = 'none';
      });
      document.addEventListener('keydown', (e) => {
        if(e.key === 'Escape') overlay.style.display = 'none';
      });
    })();


    function renderCategoryCard(cat){
      const title = escapeHtml(cat.cardTitle);
      const short = escapeHtml(cat.short || '');
      const key = escapeHtml(cat.key);
      const subId = 'tesdaModalSub';


      return `
        <article class="tesda-card" data-tesda-category="${key}">
          <div class="tesda-card-media">
            <div class="media-placeholder">TESDA<br/><span style="opacity:.9; font-weight:900;">${title}</span></div>
          </div>

          <div class="tesda-card-body">
            <div class="badges">
              <span class="tag" style="border-radius:12px; background:rgba(255,255,255,.03);">Category</span>
            </div>

            <h3 class="tesda-title">${title}</h3>

            <div class="tesda-card-content">${short}</div>

            <div class="tesda-card-actions">
              <button type="button" class="small-link tesda-viewbtn" onclick="window.__openTesdaModal('${key}')">View</button>
            </div>
          </div>
        </article>
      `;
    }


    (async()=>{
      const target = document.getElementById('tesdaCards');
      try{
        target.innerHTML = TESDA_CATEGORIES
          .filter(c => !initialCategory || c.key === initialCategory)
          .map(renderCategoryCard)
          .join('');
      }catch(e){
        console.error(e);
        target.innerHTML = '<div class="muted">Failed to load TESDA categories.</div>';
      }

    })();
  </script>
</body>
</html>
